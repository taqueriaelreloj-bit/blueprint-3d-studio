name: Blueprint 3D Studio Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Restore source
        run: npm run restore
      - name: Detector diagnostics
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('src/App.jsx','utf8');
          const needles = ['setWallAnalysis(result ?', 'possibleWalls', 'confidencePercent', 'wall-clear', 'wall-review', 'totalCandidates'];
          for (const n of needles) {
            let i = s.indexOf(n);
            console.log('\n===== '+n+' @ '+i+' =====');
            if (i >= 0) console.log(s.slice(Math.max(0,i-3500), Math.min(s.length,i+6500)));
          }
          NODE
      - name: Validate source
        run: npm run validate
      - name: Build
        run: npm run build
